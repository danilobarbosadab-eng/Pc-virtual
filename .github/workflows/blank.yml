name: Provision Windows GPU Runner with Tailscale

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  provision:
    runs-on: [self-hosted, windows, gpu, nvidia]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CPU and RAM resources
        shell: powershell
        run: |
          Write-Host "=== CPU Information ==="
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
          Write-Host "=== Memory Information ==="
          $mem = Get-CimInstance Win32_ComputerSystem
          Write-Host ("Total Physical Memory (GB): {0:N2}" -f ($mem.TotalPhysicalMemory / 1GB))
          Get-CimInstance Win32_PhysicalMemory | Select-Object Capacity, Speed, Manufacturer | Format-Table -AutoSize

      - name: Verify GPU resources
        shell: powershell
        run: |
          Write-Host "=== GPU Information ==="
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            nvidia-smi
          } else {
            Write-Warning "nvidia-smi not found. Falling back to WMI GPU query."
            Get-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM, DriverVersion | Format-List
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $msi = "$env:TEMP\tailscale-setup.msi"
          Write-Host "Downloading Tailscale installer..."
          Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
          Write-Host "Installing Tailscale..."
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) {
            throw "Tailscale installation failed: $tailscale not found."
          }
          Write-Host "Tailscale installed successfully."

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not $env:TAILSCALE_AUTHKEY) {
            throw "TAILSCALE_AUTHKEY secret is not set."
          }
          & $tailscale up --authkey=$env:TAILSCALE_AUTHKEY --hostname=$env:COMPUTERNAME --accept-routes
          & $tailscale status

      - name: Configure Windows Firewall for Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Ensuring Tailscale firewall rules exist..."
          $existing = Get-NetFirewallRule -DisplayName "Tailscale*" -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-NetFirewallRule -DisplayName "Tailscale Inbound" -Direction Inbound -Action Allow -Protocol Any -Profile Any
            New-NetFirewallRule -DisplayName "Tailscale Outbound" -Direction Outbound -Action Allow -Protocol Any -Profile Any
            Write-Host "Created Tailscale firewall rules."
          } else {
            Write-Host "Tailscale firewall rules already present."
          }
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True

      - name: Final verification
        shell: powershell
        run: |
          Write-Host "=== CPU Cores ==="
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
          Write-Host "=== RAM (GB) ==="
          "{0:N2}" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          Write-Host "=== GPU ==="
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) { nvidia-smi -L } else { (Get-CimInstance Win32_VideoController).Name }
          Write-Host "=== Tailscale Status ==="
          & "C:\Program Files\Tailscale\tailscale.exe" status
